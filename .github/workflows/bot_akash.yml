name: Akash Proxy Bot
on:
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Configurar Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Instalar Dependências
        run: npm install
      - name: Rodar Bot
        env:
          AKASH_API_KEYS: ${{ secrets.AKASH_API_KEYS }}
        run: node bot.js
